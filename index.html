<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Driving Test Translator · 多伦多安省路考常用英文 | 黄教练</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f5f2;
        --surface: #ffffff;
        --surface-2: #e9efe9;
        --ink: #182420;
        --ink-soft: #46554d;
        --line: #d5ded5;
        --accent: #1d6a48;
        --accent-strong: #145236;
        --accent-ink: #ffffff;
        --amber: #b97a16;
        --amber-bg: #fdf3e0;
        --playing-bg: #e3f1e7;
        --shadow: 0 10px 30px rgba(20, 50, 35, 0.10);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10150f;
          --surface: #1a211b;
          --surface-2: #232b24;
          --ink: #eef3ee;
          --ink-soft: #a9bab0;
          --line: #33413a;
          --accent: #3fae77;
          --accent-strong: #5cc48d;
          --accent-ink: #0c1710;
          --amber: #e0a83e;
          --amber-bg: #2c2413;
          --playing-bg: #22392a;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.55;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }

      /* ---------- Intro ---------- */
      .intro { padding: 6px 2px 2px; }
      .intro h1 {
        font-size: 30px; line-height: 1.25; margin: 0 0 6px; letter-spacing: 0.01em;
      }
      .intro h1 .en {
        display: block; font-size: 15px; font-weight: 600; color: var(--accent);
        letter-spacing: 0.06em; margin-bottom: 4px;
      }
      .intro p { margin: 0; color: var(--ink-soft); font-size: 15px; max-width: 34em; }
      .coach-line {
        margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline;
        font-size: 14px; color: var(--ink-soft);
      }
      .coach-line strong { color: var(--ink); font-size: 15px; }
      .coach-line a { color: var(--accent); font-weight: 600; text-decoration: none; }
      .coach-line a:hover { text-decoration: underline; }

      /* ---------- Category nav ---------- */
      .cats {
        display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 14px;
      }
      .cat-btn {
        appearance: none; border: 1px solid var(--line); background: var(--surface);
        color: var(--ink); border-radius: 999px; padding: 9px 14px; cursor: pointer;
        font: inherit; font-size: 14.5px; font-weight: 600; line-height: 1.2;
        display: inline-flex; align-items: center; gap: 7px;
      }
      .cat-btn .count { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
      .cat-btn[aria-selected="true"] {
        background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
      }
      .cat-btn[aria-selected="true"] .count { color: inherit; opacity: 0.75; }
      .cat-btn:focus-visible, .ctl-btn:focus-visible, .row-play:focus-visible,
      .tool-btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

      /* ---------- Player card ---------- */
      .player {
        background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
        box-shadow: var(--shadow); padding: 20px 18px 18px;
      }
      .player-top {
        display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
        font-size: 13.5px; color: var(--ink-soft); margin-bottom: 4px;
      }
      .player-top .stage { font-weight: 700; color: var(--accent); font-size: 14px; }
      .progress {
        height: 6px; border-radius: 3px; background: var(--surface-2); margin: 10px 0 18px; overflow: hidden;
      }
      .progress > div { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.25s ease; }
      .tag {
        display: inline-block; font-size: 12px; font-weight: 700; color: var(--amber);
        background: var(--amber-bg); border-radius: 6px; padding: 2px 8px; margin-bottom: 10px;
      }
      .tag[hidden], .phrase-note[hidden] { display: none; }
      .phrase-en {
        font-size: clamp(24px, 6.2vw, 32px); font-weight: 700; line-height: 1.32; margin: 0;
        letter-spacing: 0.005em;
      }
      .phrase-zh { font-size: 18px; color: var(--ink-soft); margin: 10px 0 0; }
      .phrase-note {
        margin: 14px 0 0; font-size: 14px; color: var(--ink-soft);
        background: var(--surface-2); border-radius: 10px; padding: 10px 12px;
      }
      .phrase-note b { color: var(--ink); }
      body.hide-zh .phrase-zh, body.hide-zh .row-zh { visibility: hidden; }
      body.hide-zh .phrase-note { display: none; }

      .controls {
        display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 10px; margin-top: 20px;
      }
      .ctl-btn {
        appearance: none; border: 1px solid var(--line); background: var(--surface-2);
        color: var(--ink); border-radius: 14px; padding: 13px 6px; cursor: pointer;
        font: inherit; font-size: 16px; font-weight: 700; line-height: 1.25;
        display: flex; flex-direction: column; align-items: center; gap: 1px;
      }
      .ctl-btn .sub { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
      .ctl-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .ctl-btn.primary .sub { color: inherit; opacity: 0.8; }
      .ctl-btn:active { transform: scale(0.98); }
      .ctl-btn:disabled { opacity: 0.45; cursor: default; transform: none; }

      .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      .tool-btn {
        appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
        border-radius: 999px; padding: 7px 13px; cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 600;
      }
      .tool-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

      /* ---------- Phrase list ---------- */
      .list-head { display: flex; align-items: baseline; gap: 10px; margin: 26px 2px 10px; }
      .list-head h2 { font-size: 18px; margin: 0; }
      .list-head span { font-size: 13px; color: var(--ink-soft); }
      ol.phrases { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      ol.phrases li {
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer;
      }
      ol.phrases li.current { border-color: var(--accent); background: var(--playing-bg); }
      .row-num {
        flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
        background: var(--surface-2); color: var(--ink-soft);
        display: grid; place-items: center; font-size: 13px; font-weight: 700;
      }
      li.current .row-num { background: var(--accent); color: var(--accent-ink); }
      .row-text { flex: 1 1 auto; min-width: 0; }
      .row-en { font-weight: 650; font-size: 16px; line-height: 1.4; }
      .row-zh { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
      .row-play {
        flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
        border: 1px solid var(--line); background: var(--surface); color: var(--accent);
        cursor: pointer; display: grid; place-items: center; padding: 0;
      }
      .row-play svg { width: 16px; height: 16px; fill: currentColor; }

      /* ---------- Tips & footer ---------- */
      .tips {
        margin-top: 28px; background: var(--surface); border: 1px solid var(--line);
        border-radius: 16px; padding: 16px 18px;
      }
      .tips h2 { font-size: 16px; margin: 0 0 8px; }
      .tips ul { margin: 0; padding-left: 20px; color: var(--ink-soft); font-size: 14.5px; }
      .tips li { margin: 4px 0; }
      footer { margin-top: 30px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
      footer .brand { font-weight: 700; color: var(--ink); }

      @media (max-width: 420px) {
        .controls { grid-template-columns: 1.15fr 1fr 1fr; gap: 8px; }
        .ctl-btn { font-size: 15px; padding: 12px 4px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress > div { transition: none; }
        .ctl-btn:active { transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="intro">
        <h1><span class="en">DRIVING TEST TRANSLATOR</span>多伦多安省路考常用英文</h1>
        <p>下面就是原网站里的全部句子，一条一条练：点「开始」听一句，看中文意思，再点「下一个」接着练，听不清就点「重听」。</p>
        <div class="coach-line">
          <span><strong>黄教练 Sam Huang</strong> · 多伦多驾驶教练</span>
          <span>电话 <a href="tel:+16477709866">647-770-9866</a></span>
        </div>
      </header>

      <nav class="cats" id="cats" aria-label="练习栏目"></nav>

      <section class="player" aria-live="polite">
        <div class="player-top">
          <span class="stage" id="stageLabel"></span>
          <span id="counter"></span>
        </div>
        <div class="progress"><div id="progressBar"></div></div>
        <span class="tag" id="phraseTag" hidden>你可以这样说 · You can say</span>
        <p class="phrase-en" id="phraseEn"></p>
        <p class="phrase-zh" id="phraseZh"></p>
        <p class="phrase-note" id="phraseNote" hidden></p>

        <div class="controls">
          <button class="ctl-btn primary" id="playBtn" type="button">开始<span class="sub">Start</span></button>
          <button class="ctl-btn" id="nextBtn" type="button">下一个<span class="sub">Next</span></button>
          <button class="ctl-btn" id="repeatBtn" type="button">重听<span class="sub">Repeat</span></button>
        </div>

        <div class="tools">
          <button class="tool-btn" id="zhToggle" type="button" aria-pressed="false">盲听模式：先听后看中文</button>
          <button class="tool-btn" id="speedToggle" type="button" aria-pressed="false">慢速播放 0.8×</button>
        </div>
      </section>

      <div class="list-head">
        <h2 id="listTitle"></h2>
        <span>点任意一条直接播放</span>
      </div>
      <ol class="phrases" id="phraseList"></ol>

      <footer>
        <span class="brand">© 2025 黄教练（Sam Huang）</span> · 多伦多安省路考培训 · Phone: 647-770-9866
      </footer>
    </div>

    <audio id="player" preload="auto"></audio>

    <script>
      var CATEGORIES = [
        {
          id: "prep",
          icon: "🚦",
          name: "Prep Phase",
          zh: "路考前考官对话",
          phrases: [
            { audio: "orig-prep-01", en: "Can I have your license", zh: "我可以看一下你的驾照吗？" },
            { audio: "orig-prep-02", en: "Please verify your name and date of birth", zh: "请核对您的姓名和出生日期。" },
            { audio: "orig-prep-03", en: "Please start your vehicle", zh: "请启动您的车辆。" },
            { audio: "orig-prep-04", en: "We're going to start with a quick vehicle check.", zh: "我们先做一个简短的车辆检查。" },
            { audio: "orig-prep-05", en: "Can you please turn on your left signal", zh: "你能打开左转灯吗？" },
            { audio: "orig-prep-06", en: "Can you please turn on your right signal", zh: "你能打开右转向灯吗？" },
            { audio: "orig-prep-07", en: "Press your brake on and off", zh: "踩下和松开刹车。" },
            { audio: "orig-prep-08", en: "Press the horn, please", zh: "请按喇叭。" }
          ]
        },
        {
          id: "start",
          icon: "🛣️",
          name: "Starting Phase",
          zh: "路考常用英文",
          phrases: [
            { audio: "orig-start-01", en: "At the next traffic light, turn left.", zh: "在下一个红绿灯处左转。" },
            { audio: "orig-start-02", en: "At the next traffic light, turn right.", zh: "在下一个红绿灯处右转。" },
            { audio: "orig-start-03", en: "At the stop sign turn left.", zh: "在停牌标志处左转。" },
            { audio: "orig-start-04", en: "Change lanes when safe right.", zh: "安全时变道到右。" },
            { audio: "orig-start-05", en: "Please merge onto the highway when it's safe.", zh: "请在安全的情况下并入高速公路。" },
            { audio: "orig-start-06", en: "The speed limit here is 100 kilometers per hour", zh: "这里的限速是每公里100小时" },
            { audio: "orig-start-07", en: "Take the next exit", zh: "从下一个出口出去。" },
            { audio: "orig-start-08", en: "Pull over to the curb", zh: "靠路边停车。" },
            { audio: "orig-start-09", en: "Stop the car here", zh: "把车停在这里。" },
            { audio: "orig-start-10", en: "stay in this lane", zh: "留在这条线上行驶" },
            { audio: "orig-start-11", en: "Parallel parking", zh: "平行停车" },
            { audio: "orig-start-12", en: "Uphill parking", zh: "上坡停车" },
            { audio: "orig-start-13", en: "Downhill parking", zh: "下坡停车" },
            { audio: "orig-start-14", en: "Three point turn", zh: "三点转弯" },
            { audio: "orig-start-15", en: "slow down", zh: "减速。" },
            { audio: "orig-start-16", en: "Emergency Stop", zh: "紧急停车" },
            { audio: "orig-start-17", en: "Back in", zh: "尾进。" },
            { audio: "orig-start-18", en: "Head in", zh: "头进" },
            { audio: "orig-start-19", en: "At the traffic light, turn left", zh: "在交通处左转" },
            { audio: "orig-start-20", en: "When it is safe, lane change to the left and then back to the right", zh: "安全时，向左变道，然后再回到右侧" }
          ]
        },
        {
          id: "finish",
          icon: "🏁",
          name: "Finishing Phase",
          zh: "路考结束",
          phrases: [
            { audio: "orig-finish-01", en: "Congratulations, you have met ministry standards.", zh: "恭喜，您已达到了路考的标准/通过。" },
            { audio: "orig-finish-02", en: "Congratulations, you have passed your road test.", zh: "恭喜，您已经通过了路考。" },
            { audio: "orig-finish-03", en: "I'm pleased to inform you that you have successfully passed your road test. Congratulations.", zh: "我很高兴地通知您，您已成功通过路考。恭喜！" }
          ]
        }
      ];

      var state = { cat: 0, idx: 0, playing: false, slow: false };
      var audio = document.getElementById("player");
      var catsEl = document.getElementById("cats");
      var listEl = document.getElementById("phraseList");
      var playBtn = document.getElementById("playBtn");
      var nextBtn = document.getElementById("nextBtn");

      function cat() { return CATEGORIES[state.cat]; }
      function phrase() { return cat().phrases[state.idx]; }

      function buildCats() {
        catsEl.innerHTML = "";
        CATEGORIES.forEach(function (c, i) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "cat-btn";
          b.setAttribute("aria-selected", i === state.cat ? "true" : "false");
          b.innerHTML = "";
          var label = document.createElement("span");
          label.textContent = (c.icon ? c.icon + " " : "") + c.name + " · " + c.zh;
          var count = document.createElement("span");
          count.className = "count";
          count.textContent = c.phrases.length + " 条";
          b.appendChild(label);
          b.appendChild(count);
          b.addEventListener("click", function () {
            if (state.cat !== i) { state.cat = i; state.idx = 0; stopAudio(); render(); }
          });
          catsEl.appendChild(b);
        });
      }

      function buildList() {
        listEl.innerHTML = "";
        cat().phrases.forEach(function (p, i) {
          var li = document.createElement("li");
          if (i === state.idx) li.className = "current";
          var num = document.createElement("span");
          num.className = "row-num";
          num.textContent = i + 1;
          var textWrap = document.createElement("div");
          textWrap.className = "row-text";
          var en = document.createElement("div");
          en.className = "row-en";
          en.textContent = p.en;
          var zh = document.createElement("div");
          zh.className = "row-zh";
          zh.textContent = p.zh;
          textWrap.appendChild(en);
          textWrap.appendChild(zh);
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "row-play";
          btn.setAttribute("aria-label", "播放第 " + (i + 1) + " 条");
          btn.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z"/></svg>';
          li.appendChild(num);
          li.appendChild(textWrap);
          li.appendChild(btn);
          li.addEventListener("click", function () { goTo(i, true); });
          listEl.appendChild(li);
        });
      }

      function render() {
        var c = cat(), p = phrase();
        document.getElementById("stageLabel").textContent = (c.icon ? c.icon + " " : "") + c.name + " · " + c.zh;
        document.getElementById("counter").textContent = "第 " + (state.idx + 1) + " / " + c.phrases.length + " 条";
        document.getElementById("progressBar").style.width = ((state.idx + 1) / c.phrases.length * 100) + "%";
        document.getElementById("phraseTag").hidden = !p.say;
        document.getElementById("phraseEn").textContent = p.en;
        document.getElementById("phraseZh").textContent = p.zh;
        var note = document.getElementById("phraseNote");
        if (p.note) { note.hidden = false; note.textContent = p.note; } else { note.hidden = true; }
        document.getElementById("listTitle").textContent = c.zh + " · 全部短语";
        nextBtn.disabled = state.idx === c.phrases.length - 1;
        buildCats();
        buildList();
        updatePlayBtn();
      }

      function updatePlayBtn() {
        if (state.playing) {
          playBtn.innerHTML = "暂停<span class=\"sub\">Pause</span>";
        } else if (audio.dataset.started === "1") {
          playBtn.innerHTML = "继续播放<span class=\"sub\">Play</span>";
        } else {
          playBtn.innerHTML = "开始<span class=\"sub\">Start</span>";
        }
      }

      function stopAudio() {
        audio.pause();
        state.playing = false;
        audio.dataset.started = "";
      }

      function playCurrent() {
        var src = "assets/audio/" + phrase().audio + ".mp3";
        if (audio.getAttribute("src") !== src) audio.src = src;
        audio.playbackRate = state.slow ? 0.8 : 1.0;
        var pr = audio.play();
        if (pr && pr.catch) pr.catch(function () {});
        audio.dataset.started = "1";
      }

      function goTo(i, autoplay) {
        var len = cat().phrases.length;
        state.idx = Math.max(0, Math.min(i, len - 1));
        stopAudio();
        render();
        if (autoplay) playCurrent();
      }

      playBtn.addEventListener("click", function () {
        if (state.playing) { audio.pause(); }
        else playCurrent();
      });
      document.getElementById("repeatBtn").addEventListener("click", function () {
        audio.currentTime = 0;
        playCurrent();
      });
      nextBtn.addEventListener("click", function () {
        if (state.idx < cat().phrases.length - 1) goTo(state.idx + 1, true);
      });

      audio.addEventListener("play", function () { state.playing = true; updatePlayBtn(); });
      audio.addEventListener("pause", function () { state.playing = false; updatePlayBtn(); });
      audio.addEventListener("ended", function () { state.playing = false; updatePlayBtn(); });

      document.getElementById("zhToggle").addEventListener("click", function () {
        var on = document.body.classList.toggle("hide-zh");
        this.setAttribute("aria-pressed", on ? "true" : "false");
        this.textContent = on ? "显示中文" : "盲听模式：先听后看中文";
      });
      document.getElementById("speedToggle").addEventListener("click", function () {
        state.slow = !state.slow;
        audio.playbackRate = state.slow ? 0.8 : 1.0;
        this.setAttribute("aria-pressed", state.slow ? "true" : "false");
        this.textContent = state.slow ? "恢复正常速度 1.0×" : "慢速播放 0.8×";
      });

      document.addEventListener("keydown", function (e) {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
        if (e.key === "ArrowRight") nextBtn.click();
        else if (e.key === "ArrowLeft" && state.idx > 0) goTo(state.idx - 1, true);
      });

      render();
    </script>
  </body>
</html>
